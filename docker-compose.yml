# Any VPS with Docker (DigitalOcean Droplet, Hetzner, Contabo, AWS Lightsail…): BladeOS + its own PostgreSQL.
#   1. cp .env.example .env   and fill it in (JWT_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD, POSTGRES_PASSWORD, PUBLIC_URL)
#   2. docker compose up -d --build
#   3. Put HTTPS in front (Caddy, or Cloudflare proxy) — see DEPLOY.md.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: bladeos
      POSTGRES_USER: bladeos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bladeos -d bladeos"]
      interval: 10s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://bladeos:${POSTGRES_PASSWORD}@db:5432/bladeos
      PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  pgdata:
