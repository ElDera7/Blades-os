# ============================================================================
#  BladeOS — Render Blueprint (one-click deploy)
#  New → Blueprint → connect ElDera7/Blades-os → Render auto-creates everything.
#  ⚠️  Change ADMIN_EMAIL + ADMIN_PASSWORD after first login!
# ============================================================================
services:
  - type: web
    runtime: docker
    name: bladeos
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    numInstances: 1          # one copy only: scheduled backup & birthday emails run inside the app
    plan: free               # 100% free tier — no credit card needed
    envVars:
      # ---- database (auto-linked to the PostgreSQL database below) ----
      - key: DATABASE_URL
        fromDatabase:
          name: bladeos-db
          property: connectionString

      # ---- security (auto-generated unique value per deploy) ----
      - key: JWT_SECRET
        generateValue: true

      # ---- super admin first account (rotate after first login!) ----
      - key: ADMIN_EMAIL
        value: blades@bladesbutchers.com
      - key: ADMIN_PASSWORD
        value: BladeOS@2024#
      - key: ADMIN_NAME
        value: Blades

      # ---- backups (encrypted download from Administration → Backups) ----
      - key: BACKUP_PASSPHRASE
        value: BladesData$Safe2024

      # ---- optional: nightly off-site copies to Cloudflare R2 / Backblaze B2 / AWS S3 ----
      # Uncomment + fill in these 5 to enable automatic daily encrypted off-site backups:
      # - key: BACKUP_S3_ENDPOINT
      #   value: https://<account-id>.r2.cloudflarestorage.com
      # - key: BACKUP_S3_BUCKET
      #   value: bladeos-backups
      # - key: BACKUP_S3_REGION
      #   value: auto
      # - key: BACKUP_S3_ACCESS_KEY
      #   value: <your-r2-access-key>
      # - key: BACKUP_S3_SECRET_KEY
      #   value: <your-r2-secret-key>
      # - key: BACKUP_RETENTION_DAYS
      #   value: "35"

      # ---- optional extras ----
      # - key: PUBLIC_URL
      #   value: https://bladeos.onrender.com
      # - key: RESEND_API_KEY
      #   value: <resend-key>
      # - key: EMAIL_FROM
      #   value: Blades & Butchers <hello@bladesbutchers.com>

databases:
  - name: bladeos-db
    databaseName: bladeos
    user: bladeos
    plan: free               # 100% free tier PostgreSQL — no credit card needed
